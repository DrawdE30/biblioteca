<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignar rol y permisos</title>
  <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="col-md-6 bg-light p-4 rounded shadow text-center">
      <h2 class="mb-4">Asignar rol y permisos</h2>
      <form id="formularioRoles">
        <div class="mb-3 text-start">
          <label for="usuario" class="form-label">Usuario:</label>
          <select id="usuario" name="usuario" class="form-select" required>
            <option selected disabled>Selecciona un usuario</option>
            <option>Oscar Luza</option>
            <option>Virginia Abril</option>
            <option>Karla Teves</option>
          </select>
        </div>
        <div class="mb-3 text-start">
          <label for="rol" class="form-label">Rol:</label>
          <select id="rol" name="rol" class="form-select" required>
            <option selected disabled>Selecciona un rol</option>
            <option>Administrador</option>
            <option>Vendedor</option>
            <option>Cliente</option>
          </select>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Permisos:</label>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="editarProductos" name="permisos[]" value="Editar productos">
            <label class="form-check-label" for="editarProductos">Editar productos</label>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="verReportes" name="permisos[]" value="Ver reportes">
            <label class="form-check-label" for="verReportes">Ver reportes</label>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="gestionarUsuarios" name="permisos[]" value="Gestionar usuarios">
            <label class="form-check-label" for="gestionarUsuarios">Gestionar usuarios</label>
          </div>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
