<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Cuentas de Usuarios</title>
    <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Select CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery (requerido) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap Select JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
  </head>
  <body>
    <div class="container mt-5 mb-5 d-flex justify-content-center" id="box-list">
      <div class="col-md-7 bg-light p-4 rounded shadow text-center">
        <h2 class="mb-4">Gestión de Cuentas de Usuarios</h2>
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-dark text-center">
            <tr>
              <th>ID</th>
              <th>Nombres</th>
              <th>Correo</th>
              <th>Usuario</th>
              <th>Roles</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="text-center d-grid gap-2 d-md-block">
          <button type="button" class="btn btn-success" onclick="nuevoUsuario();">
            Nuevo Usuario
          </button>
        </div>
      </div>
    </div>

    <div class="container mt-5 mb-5 d-flex justify-content-center d-none" id="box-data">
      <div class="col-md-6 bg-light p-4 rounded shadow text-center">
        <h2 class="mb-4">Datos del Usuario</h2>
        <form id="form">          
          <div class="mb-3 text-start">
            <label for="nombres" class="form-label"
              >Ingresa tus nombres:</label
            >
            <input type="hidden" name="idUsuario" />
            <input
              type="text"
              class="form-control"
              id="nombres"
              name="nombres"
              placeholder="Nombres"
              required
            />
          </div>
          <div class="mb-3 text-start">
            <label for="usuario" class="form-label"
              >Ingresa un usuario:</label
            >
            <input
              type="text"
              class="form-control"
              id="usuario"
              name="usuario"
              placeholder="Usuario"
              required
            />
          </div>
          <div class="mb-3 text-start">
            <label for="correo" class="form-label"
              >Ingresa tu correo:</label
            >
            <input
              type="email"
              class="form-control"
              id="correo"
              name="correo"
              placeholder="Correo"
              required
            />
          </div>
          <div class="mb-3 text-start">
            <label for="password" class="form-label"
              >Ingresa tu contraseña:</label
            >
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="password"
              required
            />
          </div>
          <div class="mb-3 text-start">
            <label for="password" class="form-label"
              >Seleccione rol:</label
            >
            <select name="roles" id="roles" class="form-select-sm form-control selectpicker" multiple data-live-search="true" title="Seleccionar roles">
            </select>
          </div>
          <div class="text-center d-grid gap-2 d-md-block">
            <button type="button" class="btn btn-danger" onclick="mostrarTabla();">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function nuevoUsuario() {
        document.getElementById("form").reset();
        $("#roles").selectpicker('val', []);
        document.getElementById("box-data").classList.remove("d-none");
        document.getElementById("box-list").classList.add("d-none");
      }
    </script>

    <script src="./usuario.js"></script>
  </body>
</html>
