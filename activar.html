<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Usuarios</title>
  <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="col-md-10 bg-light p-4 rounded shadow text-center">
      <h2 class="mb-4">Gestión de Cuentas de Usuarios</h2>
      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-dark text-center">
            <tr>
              <th>ID</th>
              <th>Nombres</th>
              <th>Correo</th>
              <th>Usuario</th>
              <th>Roles</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="text-center"></tbody>
        </table>
      </div>
      <div class="text-center d-grid gap-2 d-md-block">
        <a href="crear.html" class="btn btn-primary">
          <i class="fas fa-user-plus"></i> Nuevo Usuario
        </a>
      </div>
    </div>
  </div>
  <script src="usuario.js"></script>
</body>
</html>
