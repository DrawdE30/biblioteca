<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Biblioteca</title>
    <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="col-md-4 bg-light p-4 rounded shadow text-center">
        <img src="./assets/img/logo1.png" alt="Logo" class="img-fluid mb-4" style="width: 100px; height: auto;">
        <h2 class="mb-4">Iniciar Sesión</h2>
        <form id="loginForm">
            <input type="text" name="usuario" placeholder="Usuario" required class="form-control mb-3">
            <input type="password" name="contrasena" placeholder="Contraseña" required class="form-control mb-3">
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p id="mensaje"></p>
    </div>
<h2>Iniciar Sesión</h2>
<form id="loginForm">
    <input type="text" name="usuario" placeholder="Usuario" required>
    <input type="password" name="contrasena" placeholder="Contraseña" required>
    <button type="submit">Entrar</button>
</form>

<p id="mensaje"></p>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const form = new FormData(this);
    fetch('../controllers/usuarioController.php?action=login', {
        method: 'POST',
        body: JSON.stringify({
            usuario: form.get('usuario'),
            contrasena: form.get('contrasena')
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            window.location.href = 'biblioteca.html';
        } else {
            document.getElementById('mensaje').textContent = data.message || 'Error al iniciar sesión';
        }
    });
});
</script>
</body>
</html>
