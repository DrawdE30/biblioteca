<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Datos Personales</title>
  <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="col-md-3 bg-light p-4 rounded shadow">
      <h2 class="text-center mb-4">EDITAR DATOS PERSONALES</h2>
      <form id="formularioEditar">
        <div class="mb-3">
          <label for="nombres" class="form-label">Nombres completos:</label>
          <input type="text" class="form-control" id="nombres" name="nombres" required>
        </div>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo:</label>
          <input type="email" class="form-control" id="correo" name="correo" required>
        </div>
        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección:</label>
          <input type="text" class="form-control" id="direccion" name="direccion" required>
        </div>
        <div class="text-center d-grid gap-2 d-md-block">
          <button type="submit" class="btn btn-success">Editar información</button>
          <button type="button" class="btn btn-secondary" onclick="window.history.back();">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
