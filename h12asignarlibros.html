<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Libros - Gestión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>

<div class="container mt-5 mb-5">
  <h2 class="text-center mb-4">GESTIÓN DE CATÁLOGO DE LIBROS</h2>

  <!-- Formulario -->
  <form id="formularioLibro" class="border p-4 shadow rounded bg-light">
    <input type="hidden" id="idLibro">

    <div class="mb-3">
      <label for="isbn" class="form-label">ISBN:</label>
      <input type="text" class="form-control" id="isbn" name="isbn" required>
    </div>
    <div class="mb-3">
      <label for="titulo" class="form-label">Título:</label>
      <input type="text" class="form-control" id="titulo" name="titulo" required>
    </div>
    <div class="mb-3">
      <label for="autor" class="form-label">Autor:</label>
      <input type="text" class="form-control" id="autor" name="autor" required>
    </div>
    <div class="mb-3">
      <label for="editorial" class="form-label">Editorial:</label>
      <input type="text" class="form-control" id="editorial" name="editorial" required>
    </div>
    <div class="mb-3">
      <label for="anio" class="form-label">Año de Publicación:</label>
      <input type="number" class="form-control" id="anio" name="anio" min="1000" max="9999" required>
    </div>
    <div class="mb-3">
      <label for="categorias" class="form-label">Categorías:</label>
      <select multiple class="form-select" id="categorias" name="categorias" required>
        <option value="Literatura">Literatura</option>
        <option value="Ciencia">Ciencia</option>
        <option value="Historia">Historia</option>
        <option value="Tecnología">Tecnología</option>
        <option value="Arte">Arte</option>
        <option value="Educación">Educación</option>
        <option value="Negocios">Negocios</option>
      </select>
      <small class="text-muted">Ctrl (o Cmd en Mac) para seleccionar varias categorías.</small>
    </div>

    <div class="text-center d-grid gap-2 d-md-block">
      <button type="submit" class="btn btn-primary">Guardar Libro</button>
      <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">Limpiar</button>
    </div>
  </form>

  <!-- Tabla de Libros -->
  <div class="mt-5">
    <h3 class="text-center">Libros Registrados</h3>
    <div class="table-responsive">
      <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>ISBN</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Editorial</th>
            <th>Año</th>
            <th>Categorías</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaLibros">
          <!-- Libros aparecerán aquí -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- SCRIPT -->
<script>
const formulario = document.getElementById('formularioLibro');
const tabla = document.getElementById('tablaLibros');
let editandoId = null;

formulario.addEventListener('submit', function(e) {
  e.preventDefault();

  const categoriasSeleccionadas = Array.from(document.getElementById('categorias').selectedOptions).map(option => option.value);

  const libro = {
    isbn: document.getElementById('isbn').value,
    titulo: document.getElementById('titulo').value,
    autor: document.getElementById('autor').value,
    editorial: document.getElementById('editorial').value,
    anio: document.getElementById('anio').value,
    categorias: categoriasSeleccionadas
  };

  const action = editandoId ? 'actualizar' : 'insertar';
  if (editandoId) libro.idLibro = editandoId;

  fetch(`libro.php?action=${action}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(libro)
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      limpiarFormulario();
      cargarLibros();
    } else {
      alert('Error al guardar: ' + (data.error || ''));
    }
  });
});

function cargarLibros() {
  fetch('libro.php?action=listar')
    .then(res => res.json())
    .then(libros => {
      tabla.innerHTML = "";
      libros.forEach(libro => {
        tabla.innerHTML += `
          <tr>
            <td>${libro.idLibro}</td>
            <td>${libro.isbn}</td>
            <td>${libro.titulo}</td>
            <td>${libro.autor}</td>
            <td>${libro.editorial}</td>
            <td>${libro.anio}</td>
            <td>${libro.categorias.join(", ")}</td>
            <td>
              <button class="btn btn-warning btn-sm" onclick='editarLibro(${JSON.stringify(libro)})'>Editar</button>
              <button class="btn btn-danger btn-sm" onclick="eliminarLibro(${libro.idLibro})">Eliminar</button>
            </td>
          </tr>`;
      });
    });
}

function editarLibro(libro) {
  document.getElementById('isbn').value = libro.isbn;
  document.getElementById('titulo').value = libro.titulo;
  document.getElementById('autor').value = libro.autor;
  document.getElementById('editorial').value = libro.editorial;
  document.getElementById('anio').value = libro.anio;
  
  const selectCategorias = document.getElementById('categorias');
  Array.from(selectCategorias.options).forEach(option => {
    option.selected = libro.categorias.includes(option.value);
  });

  editandoId = libro.idLibro;
}

function eliminarLibro(id) {
  if (confirm('¿Seguro que quieres eliminar este libro?')) {
    fetch('libro.php?action=eliminar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idLibro: id })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        cargarLibros();
      } else {
        alert('Error al eliminar');
      }
    });
  }
}

function limpiarFormulario() {
  formulario.reset();
  editandoId = null;
}

cargarLibros();
</script>

</body>
</html>
