<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="col-md-6 bg-light p-4 rounded shadow">
      <h2 class="text-center mb-4">REGÍSTRATE</h2>
      <form id="formularioRegistro">
        <div class="mb-3">
          <label for="nombres" class="form-label">Nombres:</label>
          <input type="text" class="form-control" id="nombres" name="nombres" required>
        </div>
        <div class="mb-3">
          <label for="apellidos" class="form-label">Apellidos:</label>
          <input type="text" class="form-control" id="apellidos" name="apellidos" required>
        </div>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo:</label>
          <input type="email" class="form-control" id="correo" name="correo" required>
        </div>
        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña:</label>
          <input type="password" class="form-control" id="contrasena" name="contrasena" required>
        </div>
        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección:</label>
          <input type="text" class="form-control" id="direccion" name="direccion" required>
        </div>
        <div class="text-center d-grid gap-2 d-md-block">
          <button type="submit" class="btn btn-primary">Registrarte</button>
          <a href="#" class="btn btn-link">¿Ya tienes una cuenta? Iniciar sesión</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
