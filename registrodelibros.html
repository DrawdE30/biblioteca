<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Libros - Catálogo</title>
    <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
</head>
<body>

<div class="container mt-5 mb-5">
    <h2 class="text-center mb-4">REGISTRO DE LIBRO</h2>
    <form id="formularioLibro" class="border p-4 shadow rounded bg-light">
        <div class="mb-3">
            <label for="isbn" class="form-label">ISBN:</label>
            <input type="text" class="form-control" id="isbn" name="isbn" required>
        </div>
        <div class="mb-3">
            <label for="titulo" class="form-label">Título:</label>
            <input type="text" class="form-control" id="titulo" name="titulo" required>
        </div>
        <div class="mb-3">
            <label for="autor" class="form-label">Autor:</label>
            <input type="text" class="form-control" id="autor" name="autor" required>
        </div>
        <div class="mb-3">
            <label for="editorial" class="form-label">Editorial:</label>
            <input type="text" class="form-control" id="editorial" name="editorial" required>
        </div>
        <div class="mb-3">
            <label for="anio" class="form-label">Año de Publicación:</label>
            <input type="number" class="form-control" id="anio" name="anio" min="1000" max="9999" required>
        </div>
        <div class="mb-3">
            <label for="categoria" class="form-label">Categoría:</label>
            <select class="form-select" id="categoria" name="categoria" required>
                <option value="">--Selecciona una categoría--</option>
                <option value="literatura">Literatura</option>
                <option value="ciencia">Ciencia</option>
                <option value="historia">Historia</option>
                <option value="tecnologia">Tecnología</option>
                <option value="arte">Arte</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="imagen" class="form-label">Portada (imagen):</label>
            <input class="form-control" type="file" id="imagen" name="imagen" accept="image/png, image/jpeg" required>
        </div>
        <div class="text-center d-grid gap-2 d-md-block">
            <button type="submit" class="btn btn-primary">Registrar Libro</button>
            <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">Limpiar</button>
            <button type="button" class="btn btn-info text-white" onclick="visualizarDatos()">Visualizar Datos</button>
        </div>
    </form>

    <div id="resultado" class="mt-4"></div>
</div>

<script>
function limpiarFormulario() {
    document.getElementById('formularioLibro').reset();
}

function visualizarDatos() {
    const isbn = document.getElementById('isbn').value;
    const titulo = document.getElementById('titulo').value;
    const autor = document.getElementById('autor').value;
    const editorial = document.getElementById('editorial').value;
    const anio = document.getElementById('anio').value;
    const categoria = document.getElementById('categoria').value;
    
    let resultado = `
        <h4>Datos del Libro:</h4>
        <ul>
            <li><strong>ISBN:</strong> ${isbn}</li>
            <li><strong>Título:</strong> ${titulo}</li>
            <li><strong>Autor:</strong> ${autor}</li>
            <li><strong>Editorial:</strong> ${editorial}</li>
            <li><strong>Año de Publicación:</strong> ${anio}</li>
            <li><strong>Categoría:</strong> ${categoria}</li>
        </ul>
    `;
    document.getElementById('resultado').innerHTML = resultado;
}
</script>

</body>
</html>
