<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Libros</title>
    <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
    <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="libro.js"></script>
</head>
<body>
    <div class="container mt-5 mb-5 d-flex justify-content-center">
        <div class="col-md-6 bg-light p-4 rounded shadow text-center">
            <h1>Catálogo de Libros 📚</h1>
            <form id="libroForm">
                <input type="text" id="titulo" name="titulo" placeholder="Título" required><br>
                <input type="text" id="autor" name="autor" placeholder="Autor" required><br>
                <input type="number" id="anio_publicacion" name="anio_publicacion" placeholder="Año de publicación" required><br>
                <input type="text" id="isbn" name="isbn" placeholder="ISBN" required><br>
                <label>Categorías:</label><br>
                <select id="categorias" name="categorias[]" multiple></select><br><br>
                <button type="submit" class="btn btn-primary">Guardar Libro</button>
            </form>

            <h2>Lista de Libros</h2>
            <table border="1" id="librosTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Año</th>
                        <th>ISBN</th>
                        <th>Categorías</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</body>
</html>
