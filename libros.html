<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Libros</title>
    <script defer src="libro.js"></script>
</head>
<body>
    <h1>Catálogo de Libros 📚</h1>

    <form id="libroForm">
        <input type="text" id="titulo" name="titulo" placeholder="Título" required><br>
        <input type="text" id="autor" name="autor" placeholder="Autor" required><br>
        <input type="number" id="anio_publicacion" name="anio_publicacion" placeholder="Año de publicación" required><br>
        <input type="text" id="isbn" name="isbn" placeholder="ISBN" required><br>
        <label>Categorías:</label><br>
        <select id="categorias" name="categorias[]" multiple></select><br><br>
        <button type="submit">Guardar Libro</button>
    </form>

    <h2>Lista de Libros</h2>
    <table border="1" id="librosTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Autor</th>
                <th>Año</th>
                <th>ISBN</th>
                <th>Categorías</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</body>
</html>
