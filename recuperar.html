<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
  <title>Restablecer contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="col-md-6 bg-light p-4 rounded shadow text-center">
      <h2 class="mb-4">Restablecer contraseña</h2>

      <div class="alert alert-warning d-flex align-items-center justify-content-center" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle me-2" viewBox="0 0 16 16">
          <path d="M7.938 2.016a.13.13 0 0 1 .124 0l6.857 3.942c.07.04.11.118.108.2v7.684c0 .124-.1.224-.224.224H1.297a.224.224 0 0 1-.224-.224V6.158c-.002-.082.038-.16.108-.2L7.938 2.016zM8 4.066L1.867 7.634v6.058h12.266V7.634L8 4.066zM8 8.499a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2a.5.5 0 0 1 .5-.5zm.5-3a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0z"/>
        </svg>
        El enlace para restablecer la contraseña ha expirado
      </div>

      <form id="formularioRestablecer">
        <div class="mb-3 text-start">
          <label for="nuevaContrasena" class="form-label">Ingresa tu nueva contraseña:</label>
          <input type="password" class="form-control" id="nuevaContrasena" name="nuevaContrasena" required>
        </div>
        <div class="mb-3 text-start">
          <label for="confirmarContrasena" class="form-label">Confirmar contraseña:</label>
          <input type="password" class="form-control" id="confirmarContrasena" name="confirmarContrasena" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Restablecer contraseña</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
