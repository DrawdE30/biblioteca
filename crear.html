<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Usuario</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Select CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">
  <!-- FontAwesome (opcional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="container mt-5 d-flex justify-content-center">
    <div class="col-md-6 bg-light p-4 rounded shadow text-center">
      <h2 class="mb-4">Nuevo Usuario</h2>
      <form id="form">
        <input type="hidden" name="idUsuario" />
        <div class="mb-3 text-start">
          <label class="form-label">Nombres:</label>
          <input type="text" class="form-control" name="nombres" required />
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Usuario:</label>
          <input type="text" class="form-control" name="usuario" required />
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Correo:</label>
          <input type="email" class="form-control" name="correo" required />
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Contraseña:</label>
          <input type="password" class="form-control" name="password" required />
        </div>

        <!-- Campo de Roles con rol 'Cliente' predeterminado y no editable -->
        <div class="mb-3 text-start">
          <label class="form-label">Rol:</label>
          <input type="text" class="form-control" value="Cliente" readonly />
        </div>

        <div class="text-center">
          <a href="activar.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Visualizar usuarios -->
  <div class="container mt-5">
    <h3 class="text-center">Usuarios Registrados</h3>
    <table class="table table-striped table-bordered align-middle">
      <thead class="table-dark text-center">
        <tr>
          <th>ID</th>
          <th>Nombres</th>
          <th>Correo</th>
          <th>Usuario</th>
          <th>Roles</th>
        </tr>
      </thead>
      <tbody id="tableBody" class="text-center"></tbody>
    </table>
  </div>

  <!-- Scripts al final para mejor rendimiento -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
  <script src="usuario.js"></script>
</body>
</html>
