<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Usuario</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </head>
<body>
  <div class="container mt-5 d-flex justify-content-center">
    <div class="col-md-6 bg-light p-4 rounded shadow text-center">
      <h2 class="mb-4">Nuevo Usuario</h2>
      <form id="form">
        <input type="hidden" name="idUsuario" />
        <div class="mb-3 text-start">
          <label class="form-label">Nombres:</label>
          <input type="text" class="form-control" name="nombres" required />
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Usuario:</label>
          <input type="text" class="form-control" name="usuario" required />
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Correo:</label>
          <input type="email" class="form-control" name="correo" required />
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Contraseña:</label>
          <input type="password" class="form-control" name="password" required />
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Roles:</label>
          <select name="roles" id="roles" class="form-select-sm form-control selectpicker" multiple data-live-search="true" title="Seleccionar roles"></select>
        </div>
        <div class="text-center">
          <a href="activar.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
    <script src="usuario.js"></script>
</body>
</html>
