<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de postulantes - Admisión 2025</title>
    <link rel="stylesheet" href="bootstrap.min.css" crossorigin="anonymous">
	<link href="https://getbootstrap.com/docs/5.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<link href="https://getbootstrap.com/docs/5.1/assets/css/docs.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 mb-5">
        <h2 class="text-center mb-4">REGISTRO DE POSTULANTE</h2>
        <form id="formulario" class="border p-4 shadow rounded bg-light">
            <div class="mb-3">
                <label for="dni" class="form-label">DNI:</label>
                <input type="text" class="form-control" id="dni" name="dni" required>
            </div>
            <div class="mb-3">
                <label for="nombres" class="form-label">Nombres:</label>
                <input type="text" class="form-control" id="nombres" name="nombres" required>
            </div>
            <div class="mb-3">
                <label for="apellidos" class="form-label">Apellidos:</label>
                <input type="text" class="form-control" id="apellidos" name="apellidos" required>
            </div>
            <div class="mb-3">
                <label class="form-label d-block">Género:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="masculino" name="genero" value="Masculino" required>
                    <label class="form-check-label" for="masculino">Masculino</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="femenino" name="genero" value="Femenino" required>
                    <label class="form-check-label" for="femenino">Femenino</label>
                </div>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo:</label>
                <input type="email" class="form-control" id="correo" name="correo" required>
            </div>
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha de Nacimiento:</label>
                <input type="date" class="form-control" id="fecha" name="fecha" required>
            </div>
            <div class="mb-3">
                <label for="carrera" class="form-label">Carrera:</label>
                <select class="form-select" id="carrera" name="carrera" required>
                    <option value="">--Selecciona una carrera--</option>
                    <option value="arquitectura">ARQUITECTURA DE PLATAFORMAS Y S.TI</option>
                    <option value="enfermeria">ENFERMERÍA TÉCNICA</option>
                    <option value="mecatronica">MECATRÓNICA AUTOMOTRIZ</option>
                    <option value="mecanica">MECÁNICA DE PRODUCCIÓN INDUSTRIAL</option>
                    <option value="agropecuaria">PRODUCCIÓN AGROPECUARIA</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="foto" class="form-label">Foto:</label>
                <input class="form-control" type="file" id="foto" name="foto" accept="image/png, image/jpeg" required>
            </div>
            <div class="text-center d-grid gap-2 d-md-block">
                <button type="submit" class="btn btn-primary">Enviar</button>
                <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">Limpiar</button>
                <button type="button" class="btn btn-info text-white" onclick="visualizarDatos()">Visualizar Datos</button>
            </div>
        </form>
    <div id="resultado" class="mt-4"></div>
    </div>
</body>
</html>
