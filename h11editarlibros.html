<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Libros - Gestión</title>
    <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
</head>
<body>

<div class="container mt-5 mb-5">
    <h2 class="text-center mb-4">GESTIÓN DE CATÁLOGO DE LIBROS</h2>
    
    <!-- Formulario -->
    <form id="formularioLibro" class="border p-4 shadow rounded bg-light">
        <input type="hidden" id="indiceEditar" value="">
        
        <div class="mb-3">
            <label for="isbn" class="form-label">ISBN:</label>
            <input type="text" class="form-control" id="isbn" name="isbn" required>
        </div>
        <div class="mb-3">
            <label for="titulo" class="form-label">Título:</label>
            <input type="text" class="form-control" id="titulo" name="titulo" required>
        </div>
        <div class="mb-3">
            <label for="autor" class="form-label">Autor:</label>
            <input type="text" class="form-control" id="autor" name="autor" required>
        </div>
        <div class="mb-3">
            <label for="editorial" class="form-label">Editorial:</label>
            <input type="text" class="form-control" id="editorial" name="editorial" required>
        </div>
        <div class="mb-3">
            <label for="anio" class="form-label">Año de Publicación:</label>
            <input type="number" class="form-control" id="anio" name="anio" min="1000" max="9999" required>
        </div>
        <div class="mb-3">
            <label for="categoria" class="form-label">Categoría:</label>
            <select class="form-select" id="categoria" name="categoria" required>
                <option value="">--Selecciona una categoría--</option>
                <option value="literatura">Literatura</option>
                <option value="ciencia">Ciencia</option>
                <option value="historia">Historia</option>
                <option value="tecnologia">Tecnología</option>
                <option value="arte">Arte</option>
            </select>
        </div>
        <div class="text-center d-grid gap-2 d-md-block">
            <button type="submit" class="btn btn-primary">Guardar Libro</button>
            <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">Limpiar</button>
        </div>
    </form>

    <!-- Tabla de Libros -->
    <div class="mt-5">
        <h3 class="text-center">Libros Registrados</h3>
        <div class="table-responsive">
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>ISBN</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Editorial</th>
                        <th>Año</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaLibros">
                    <!-- Aquí se mostrarán los libros -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let libros = [];

document.getElementById('formularioLibro').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const indiceEditar = document.getElementById('indiceEditar').value;
    const libro = {
        isbn: document.getElementById('isbn').value,
        titulo: document.getElementById('titulo').value,
        autor: document.getElementById('autor').value,
        editorial: document.getElementById('editorial').value,
        anio: document.getElementById('anio').value,
        categoria: document.getElementById('categoria').value,
    };
    
    if (indiceEditar === "") {
        // Agregar nuevo libro
        libros.push(libro);
    } else {
        // Editar libro existente
        libros[indiceEditar] = libro;
        document.getElementById('indiceEditar').value = "";
    }
    
    limpiarFormulario();
    mostrarLibros();
});

function limpiarFormulario() {
    document.getElementById('formularioLibro').reset();
    document.getElementById('indiceEditar').value = "";
}

function mostrarLibros() {
    const tabla = document.getElementById('tablaLibros');
    tabla.innerHTML = "";
    
    libros.forEach((libro, index) => {
        tabla.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>${libro.isbn}</td>
                <td>${libro.titulo}</td>
                <td>${libro.autor}</td>
                <td>${libro.editorial}</td>
                <td>${libro.anio}</td>
                <td>${libro.categoria}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="editarLibro(${index})">Editar</button>
                    <button class="btn btn-sm btn-danger" onclick="eliminarLibro(${index})">Eliminar</button>
                </td>
            </tr>
        `;
    });
}

function editarLibro(index) {
    const libro = libros[index];
    document.getElementById('isbn').value = libro.isbn;
    document.getElementById('titulo').value = libro.titulo;
    document.getElementById('autor').value = libro.autor;
    document.getElementById('editorial').value = libro.editorial;
    document.getElementById('anio').value = libro.anio;
    document.getElementById('categoria').value = libro.categoria;
    document.getElementById('indiceEditar').value = index;
}

function eliminarLibro(index) {
    if (confirm('¿Estás seguro de eliminar este libro?')) {
        libros.splice(index, 1);
        mostrarLibros();
    }
}
</script>

</body>
</html>
