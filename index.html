<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookZone - Login</title>
    <link rel="icon" href="./assets/img/logo.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .nav-tabs .nav-link {
        cursor: pointer;
      }
      .nav-tabs .nav-link.active {
        font-weight: bold;
        /* Puedes personalizar el estilo de la pestaña activa aquí */
      }
    </style>
  </head>
  <body class="bg-light">
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div
        class="card p-4 shadow rounded"
        style="width: 100%; max-width: 400px"
      >
        <div class="text-center mb-4">
          <div id="icon-init" class="fs-1 d-none">👤</div>
          <div id="icon-customer" class="fs-1">🙋‍♂️</div>
          <div id="icon-worker" class="fs-1 d-none">👷🏻‍♂️</div>
          <h3 class="mt-2">Iniciar Sesión</h3>
        </div>

        <ul
          class="nav nav-tabs nav-justified mb-3"
          id="pills-tab"
          role="tablist"
          style="font-size: small;"
        >
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="pills-cliente-tab"
              type="button"
              role="tab"
              aria-controls="pills-cliente"
              aria-selected="true"
              onclick="mostrarFormulario('Cliente')"
            >
              Como Cliente
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="pills-colaborador-tab"
              type="button"
              role="tab"
              aria-controls="pills-colaborador"
              aria-selected="false"
              onclick="mostrarFormulario('Colaborador')"
            >
              Como Colaborador
            </button>
          </li>
        </ul>

        <form id="formularioLogin" class="mt-3">
          <div class="text-center mb-3">
            <small id="tipoUsuario" class="text-muted"
              >Como: Cliente</small
            >
          </div>

          <div class="mb-3">
            <label for="correo" class="form-label">Ingresar Correo</label>
            <input
              type="email"
              class="form-control"
              id="correo"
              placeholder="correo@ejemplo.com"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Ingresar Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="***************"
              required
            />
          </div>

          <div class="d-grid gap-2 d-md-flex justify-content-md-center">
            <button type="button" class="btn btn-danger" onclick="regresar()">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
          <div class="mt-3 mb-3 text-center">
            <a href="./recuperar.html" target="_blank">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="mt-3 mb-3 text-center">
            <a href="./registro.html" target="_blank">¿No tienes cuenta? - Registrate</a>
          </div>
        </form>
      </div>
    </div>

    <script>
      function mostrarFormulario(tipo) {
        document.getElementById("icon-init").classList.add("d-none");
        document.getElementById("formularioLogin").classList.remove("d-none");

        // Actualizar la clase activa de las pestañas
        document.getElementById("pills-cliente-tab").classList.remove("active");
        document
          .getElementById("pills-colaborador-tab")
          .classList.remove("active");

        if (tipo == "Cliente") {
          document.getElementById("icon-worker").classList.add("d-none");
          document.getElementById("icon-customer").classList.remove("d-none");
          document.getElementById("pills-cliente-tab").classList.add("active");
          document.getElementById("tipoUsuario").innerText =
            "Como: Cliente";
        }
        if (tipo == "Colaborador") {
          document.getElementById("icon-customer").classList.add("d-none");
          document.getElementById("icon-worker").classList.remove("d-none");
          document
            .getElementById("pills-colaborador-tab")
            .classList.add("active");
          document.getElementById("tipoUsuario").innerText =
            "Como: Colaborador";
        }
      }

      function regresar() {
        document.getElementById("icon-init").classList.remove("d-none");
        document.getElementById("icon-worker").classList.add("d-none");
        document.getElementById("icon-customer").classList.add("d-none");

        document.getElementById("formularioLogin").reset();
        document.getElementById("formularioLogin").classList.add("d-none");

        // Activar la pestaña de Cliente al regresar
        document.getElementById("pills-cliente-tab").classList.add("active");
        mostrarFormulario("Cliente"); // Simula el clic para actualizar iconos y texto
      }

      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("icon-init").classList.add("d-none");
        document.getElementById("icon-customer").classList.remove("d-none");
        document.getElementById("icon-worker").classList.add("d-none");

        document.getElementById("formularioLogin").classList.remove("d-none");
        document.getElementById("tipoUsuario").innerText =
          "Registrando como: Cliente";

        document.getElementById("pills-cliente-tab").classList.add("active");
        document
          .getElementById("pills-colaborador-tab")
          .classList.remove("active");
      });
    </script>
    <script src="./login.js"></script>
  </body>
</html>
